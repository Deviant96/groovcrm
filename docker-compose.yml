services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Share the host network so the app can reach native Postgres on
    # 127.0.0.1:${POSTGRES_PORT}. Port mapping is unused in this mode — the
    # process binds BACKEND_HOST_PORT directly on the VPS (default 3001).
    network_mode: host
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-groovcrm}:${POSTGRES_PASSWORD:-groovcrm}@127.0.0.1:${POSTGRES_PORT:-5434}/${POSTGRES_DB:-groovcrm}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      JWT_REFRESH_REMEMBER_EXPIRES_IN: ${JWT_REFRESH_REMEMBER_EXPIRES_IN:-30d}
      PORT: ${BACKEND_HOST_PORT:-3001}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://crm.miretazam.com}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      NODE_ENV: production

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
    # Exposed on localhost for the VPS host Apache reverse proxy.
    ports:
      - '127.0.0.1:${FRONTEND_HOST_PORT:-8081}:80'
